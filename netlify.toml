[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory     = "netlify/functions"
  node_bundler  = "esbuild"

[functions."cleanup-deleted-accounts"]
  schedule = "0 0 * * *" # Runs daily at midnight UTC to purge expired account deletion requests

# ── API function redirect ──────────────────────────────────────────────────
[[redirects]]
  from   = "/api/analyze"
  to     = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from   = "/api/update-usage"
  to     = "/.netlify/functions/update-usage"
  status = 200

[[redirects]]
  from   = "/api/ai-analyze"
  to     = "/.netlify/functions/ai-analyze"
  status = 200

[[redirects]]
  from   = "/api/send-feedback"
  to     = "/.netlify/functions/send-feedback"
  status = 200

[[redirects]]
  from   = "/api/send-team-waitlist"
  to     = "/.netlify/functions/send-team-waitlist"
  status = 200

[[redirects]]
  from   = "/api/request-account-deletion"
  to     = "/.netlify/functions/request-account-deletion"
  status = 200

[[redirects]]
  from   = "/api/cleanup-deleted-accounts"
  to     = "/.netlify/functions/cleanup-deleted-accounts"
  status = 200

# ── SPA fallback — all routes serve index.html ─────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options            = "nosniff"
    X-Frame-Options                   = "SAMEORIGIN"
    Referrer-Policy                   = "strict-origin-when-cross-origin"
    Permissions-Policy                = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection                  = "1; mode=block"
    Strict-Transport-Security         = "max-age=31536000; includeSubDomains; preload"
